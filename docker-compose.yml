version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediation}
      POSTGRES_USER: ${POSTGRES_USER:-mediation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  fhir-validator:
    # Real HL7 FHIR R4 conformity validation (FR6.3): resources are POSTed
    # to this server's $validate operation rather than only checked by a
    # client-side library. Uses HAPI's bundled embedded DB - it's a
    # stateless validation tool here, not a system of record, so it isn't
    # wired into the shared Postgres.
    image: hapiproject/hapi:latest
    restart: unless-stopped
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
    ports:
      - "8080:8080"
    # No healthcheck: the hapiproject/hapi image has no shell (no sh,
    # wget or curl), so a CMD-SHELL healthcheck can never execute here.
    # Startup takes ~40s; readiness is GET /fhir/metadata returning 200.

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
